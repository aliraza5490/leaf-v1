[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.10",
    "pydantic-settings>=2.9",
    "alembic>=1.16",
    "email-validator>=2.2",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "sse-starlette>=2.0",
    "pipecat-ai[webrtc,deepgram,groq,cartesia,silero,runner]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
